# Dependabot keeps the pinned versions current; it cannot add a dependency.
# A new module still needs an allowlist entry and a justification
# (docs/doctrine/ci-security-policy.md §3.1), and every bump goes through
# the vault-gate like any other change.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      go-modules:
        patterns: ["*"]
    open-pull-requests-limit: 3
    labels: [dependencies, go]
    commit-message:
      prefix: "deps(go)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(actions)"
  # The worker's Python runtime (workers/genome/requirements.txt) is not a
  # dependency set a bot may move: torch, transformers, tokenizers,
  # safetensors and numpy are the pinned runtime the determinism
  # measurements were made on (VERIFIABLE-CLAIMS C16, C19, C26). A change
  # there is a re-measurement on hardware, made by hand and recorded.
  # Dependabot still raises security alerts for them; it opens no pull
  # request.
