# AI Continuity Platform — Semgrep static analysis
#
# Semgrep complements CodeQL with project-specific rules that capture
# the doctrinal invariants we know about but CodeQL's general rule set
# does not. Examples (full ruleset in scripts/semgrep/rules.yml):
#
#   - "audit-event types must include the canonical fields".
#   - "tee.Producer.Quote callers must check len(nonce) >= NonceMinBytes".
#   - "session sealing must use AAD that includes ManifestID".
#
# Why have both? CodeQL is excellent at general taint-flow style
# vulnerabilities; Semgrep is excellent at custom in-house rules
# expressed concisely in YAML. Together they cover both standard and
# project-specific risk surfaces.

name: semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write   # post inline review comments

jobs:
  semgrep:
    name: semgrep-go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: returntocorp/semgrep:1.86.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Semgrep CI mode: scan with our private ruleset + curated
      # ecosystem rules (Go, secrets, Docker, GitHub Actions).
      - name: Run Semgrep
        # Report-only for now: findings are uploaded to the Security tab (SARIF)
        # but do not block the release. Tighten to blocking once triaged.
        continue-on-error: true
        run: |
          semgrep ci \
            --config scripts/semgrep/rules.yml \
            --config p/golang \
            --config p/secrets \
            --config p/dockerfile \
            --config p/github-actions \
            --sarif-output=semgrep.sarif
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
