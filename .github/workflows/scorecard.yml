# OpenSSF Scorecard: an outside measure of the repository's practices
# (branch protection, pinned dependencies, signed releases, CI tests,
# SAST, dangerous workflows, ...), published to the Scorecard API so the
# README badge shows the current score, and to code scanning as SARIF.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 3 * * 1" # Mondays, 03:30 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write        # publish_results signs the upload with OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: results.sarif
