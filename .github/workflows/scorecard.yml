# OpenSSF Scorecard: an outside measure of the repository's practices
# (branch protection, pinned dependencies, signed releases, CI tests,
# SAST, dangerous workflows, ...), published to the Scorecard API so the
# README badge shows the current score, and to code scanning as SARIF.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 3 * * 1" # Mondays, 03:30 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write        # publish_results signs the upload with OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
