# AI Continuity Platform — release workflow
#
# Triggered by a signed semver tag matching v*. Produces:
#   - five binaries (sagvd, acp-compute, acpctl, acp-bootstrap, acp-keygen), built
#     reproducibly, their -fips variants on the certified module, and acpctl
#     and acp-keygen for macOS, Windows and Linux arm64 (the Makefile's
#     build-cross),
#   - the worker package, the Python distribution (the wheel and the sdist
#     of pyproject.toml, published to PyPI by the `pypi` job on a final tag)
#     and a signed list of every artifact's SHA-256,
#   - an SBOM per artifact (syft, SPDX-JSON),
#   - cosign keyless signatures + transparency-log entries,
#   - a SLSA provenance attestation (slsa-github-generator).
#
# SLSA target: Level 2 at MVP, Level 3 by end of Phase 9
# (docs/doctrine/ci-security-policy.md §6).

name: release

on:
  push:
    tags:
      - 'v*.*.*'

# The workflow's own token is read-only; each job names the write
# permissions it needs (Scorecard Token-Permissions reads the top level).
permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write       # publish release assets (gh release create / upload)
      id-token: write       # keyless cosign
      packages: read
      actions: read
    env:
      RELEASE_BINARIES: sagvd acp-compute acpctl acp-bootstrap acp-keygen
      # The same five on the certified Go Cryptographic Module (ADR 0030),
      # named by the module version, never an alias.
      RELEASE_BINARIES_FIPS: sagvd-fips acp-compute-fips acpctl-fips acp-bootstrap-fips acp-keygen-fips
      FIPS_MODULE: v1.0.0
    defaults:
      run:
        working-directory: .
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify tag is signed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          # Fetch the annotated tag object and the default branch explicitly,
          # so verification does not depend on how checkout left the workspace
          # (checkout can leave the tag name pointing at the bare commit, which
          # git verify-tag rejects as "a non-tag object of type commit").
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git fetch --no-tags origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          # The keys that may sign a release are pinned on the protected default
          # branch — never read from the tagged tree, which whoever pushed the
          # tag controls. SSH keys: .github/allowed_signers; OpenPGP keys:
          # .github/release-signing-keys.asc.
          if git cat-file -e "origin/${DEFAULT_BRANCH}:.github/allowed_signers" 2>/dev/null; then
            git show "origin/${DEFAULT_BRANCH}:.github/allowed_signers" > "$RUNNER_TEMP/allowed_signers"
            git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          fi
          if git cat-file -e "origin/${DEFAULT_BRANCH}:.github/release-signing-keys.asc" 2>/dev/null; then
            git show "origin/${DEFAULT_BRANCH}:.github/release-signing-keys.asc" | gpg --batch --import
          fi
          git verify-tag "refs/tags/${TAG}" || { echo "release tag must be signed by a key pinned on ${DEFAULT_BRANCH}"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build binaries (reproducible)
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          # SOURCE_DATE_EPOCH = the tagged commit's timestamp, so anything
          # in the build chain that consults it produces deterministic output.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          # The tools for the other platforms (bin/<tool>-<os>-<arch>) are
          # named by the Makefile; the list is read from it, not kept here.
          RELEASE_CROSS="$(make -s cross-binaries)"; echo "RELEASE_CROSS=$RELEASE_CROSS" >> "$GITHUB_ENV"
          make build build-fips build-cross FIPS_MODULE="$FIPS_MODULE"
          make verify-reproducible FIPS_MODULE="$FIPS_MODULE"
          # The -fips binaries name the module they were built on, in their
          # build settings and in their version line.
          for b in $RELEASE_BINARIES_FIPS; do
            go version -m "bin/$b" | grep -E '^\s*build\s+GOFIPS140=' | grep -q "GOFIPS140=${FIPS_MODULE}" || { echo "$b: not built on GOFIPS140=${FIPS_MODULE}"; exit 1; }
          done
          line="$(./bin/sagvd-fips version)"; echo "$line"
          case "$line" in *"fips140=on module=${FIPS_MODULE} "*) ;; *) echo "sagvd-fips does not report the module"; exit 1;; esac
          # Each cross build names, in its build settings, the platform its
          # file name promises.
          for b in $RELEASE_CROSS; do
            s="${b%.exe}"; arch="${s##*-}"; r="${s%-*}"; os="${r##*-}"
            if ! { go version -m "bin/$b" | grep -qE "^\s*build\s+GOOS=${os}$" && go version -m "bin/$b" | grep -qE "^\s*build\s+GOARCH=${arch}$"; }; then
              echo "$b: not a ${os}/${arch} build"; exit 1
            fi
          done

      # The worker package: workers/genome (vg_genome, its locks, the
      # examples) as one reproducible tarball — sorted names, the tagged
      # commit's time as every mtime, numeric owner 0, gzip without its
      # timestamp — packed twice and compared, then signed and attested
      # with the binaries. Until 0.4.2 a deployment took it from the
      # tag's source tree.
      - name: Pack the worker package (reproducible)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          mkdir -p dist
          pack() {
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
                --exclude='__pycache__' --exclude='.pytest_cache' \
                -C workers -cf - genome | gzip -n > "$1"
          }
          pack "dist/genome-worker-${VERSION}.tar.gz"
          pack "/tmp/genome-worker-again.tar.gz"
          cmp "dist/genome-worker-${VERSION}.tar.gz" /tmp/genome-worker-again.tar.gz
          sha256sum "dist/genome-worker-${VERSION}.tar.gz"

      # The Python distribution (pyproject.toml): the wheel and the sdist,
      # built twice from the hash-pinned tools of python/requirements-build.lock
      # and compared (scripts/build_python_dist.sh), the version in
      # pyproject.toml held to the tag. A rehearsal tag (vX.Y.Z-rcN) builds
      # and signs them like a release and does not publish them (the pypi job).
      - name: Build the Python distribution (reproducible)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PYVER="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          case "$TAG" in "v${PYVER}"|"v${PYVER}"-rc[0-9]*) ;; *) echo "pyproject.toml says ${PYVER}; the tag is ${TAG}"; exit 1;; esac
          scripts/build_python_dist.sh dist
          { echo "PYVER=${PYVER}"
            echo "PY_WHEEL=vaultgenome-${PYVER}-py3-none-any.whl"
            echo "PY_SDIST=vaultgenome-${PYVER}.tar.gz"; } >> "$GITHUB_ENV"

      # One signed list of every artifact's SHA-256 — the binaries, the
      # worker package, the wheel and the sdist — in sha256sum's format, so
      # that `sha256sum -c checksums-<tag>.txt` in a directory of downloaded
      # assets checks them all at once, and a package manager's formula pins
      # what the list says.
      - name: Checksums of every artifact
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # shellcheck disable=SC2086
          { ( cd bin && sha256sum $RELEASE_BINARIES $RELEASE_BINARIES_FIPS $RELEASE_CROSS )
            ( cd dist && sha256sum "genome-worker-${VERSION}.tar.gz" "$PY_WHEEL" "$PY_SDIST" ); } > "dist/checksums-${VERSION}.txt"
          cat "dist/checksums-${VERSION}.txt"

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: Put syft on PATH
        run: sudo ln -sf "${{ steps.syft.outputs.cmd }}" /usr/local/bin/syft

      - name: SBOM per artifact
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for b in $RELEASE_BINARIES $RELEASE_BINARIES_FIPS $RELEASE_CROSS; do
            syft "bin/$b" -o spdx-json="dist/${b}.sbom.spdx.json"
          done
          syft "dir:workers/genome" -o spdx-json="dist/genome-worker-${VERSION}.sbom.spdx.json"
          # The sdist names its package to syft as a file; the wheel does
          # only once unpacked, so it is scanned unpacked, under its own name.
          syft "dist/$PY_SDIST" -o spdx-json="dist/${PY_SDIST}.sbom.spdx.json"
          rm -rf /tmp/wheel && mkdir -p /tmp/wheel && unzip -q "dist/$PY_WHEEL" -d /tmp/wheel
          syft "dir:/tmp/wheel" --source-name "$PY_WHEEL" --source-version "$PYVER" -o spdx-json="dist/${PY_WHEEL}.sbom.spdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign 3 signs a blob into one Sigstore bundle by default and ignores
          # --output-signature / --output-certificate; the 0.3.0 run failed on it
          # after the installer moved to v4. Pinned to 2.6.5: every asset gets
          # the .sig + .cert pair the documents of earlier releases verify
          # with, and beside it the Sigstore bundle (<asset>.sigstore.json,
          # the new bundle format: signature, certificate and the Rekor
          # entry in one file) that `cosign verify-blob --new-bundle-format
          # --bundle … --trusted-root trusted_root.json` checks with no route
          # at all — what an air-gapped site needs (KNOWN_ISSUES #15).
          # Measured on 2.6.5: `--offline` is not that; it still reaches for
          # the TUF mirror and fails without a route.
          cosign-release: 'v2.6.5'

      - name: Sign binaries and the worker package (keyless)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for b in $RELEASE_BINARIES $RELEASE_BINARIES_FIPS $RELEASE_CROSS; do
            cosign sign-blob --yes --new-bundle-format "bin/$b" \
              --output-signature "dist/${b}.sig" \
              --output-certificate "dist/${b}.cert" \
              --bundle "dist/${b}.sigstore.json"
          done
          for f in "genome-worker-${VERSION}.tar.gz" "$PY_WHEEL" "$PY_SDIST" "checksums-${VERSION}.txt"; do
            cosign sign-blob --yes --new-bundle-format "dist/$f" \
              --output-signature "dist/$f.sig" \
              --output-certificate "dist/$f.cert" \
              --bundle "dist/$f.sigstore.json"
          done

      - name: Sign SBOMs (keyless)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for b in $RELEASE_BINARIES $RELEASE_BINARIES_FIPS $RELEASE_CROSS; do
            cosign sign-blob --yes --new-bundle-format "dist/${b}.sbom.spdx.json" \
              --output-signature "dist/${b}.sbom.sig" \
              --output-certificate "dist/${b}.sbom.cert" \
              --bundle "dist/${b}.sbom.sigstore.json"
          done
          cosign sign-blob --yes --new-bundle-format "dist/genome-worker-${VERSION}.sbom.spdx.json" \
            --output-signature "dist/genome-worker-${VERSION}.sbom.sig" \
            --output-certificate "dist/genome-worker-${VERSION}.sbom.cert" \
            --bundle "dist/genome-worker-${VERSION}.sbom.sigstore.json"
          for f in "$PY_WHEEL" "$PY_SDIST"; do
            cosign sign-blob --yes --new-bundle-format "dist/${f}.sbom.spdx.json" \
              --output-signature "dist/${f}.sbom.sig" \
              --output-certificate "dist/${f}.sbom.cert" \
              --bundle "dist/${f}.sbom.sigstore.json"
          done

      # The PyPI job publishes these exact bytes, after verifying them under
      # this workflow's identity, as the image job does with the binaries.
      - name: Keep the Python distribution for the PyPI job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distribution
          path: |
            dist/vaultgenome-*.whl
            dist/vaultgenome-*.tar.gz
            dist/vaultgenome-*.whl.sigstore.json
            dist/vaultgenome-*.tar.gz.sigstore.json
          if-no-files-found: error
          retention-days: 1

      # The image job builds on another runner: it takes these exact bytes,
      # with their Sigstore bundles, and verifies them before packing.
      - name: Keep the signed binaries for the image job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: |
            bin/sagvd
            bin/acp-compute
            bin/sagvd-fips
            bin/acp-compute-fips
            dist/sagvd.sigstore.json
            dist/acp-compute.sigstore.json
            dist/sagvd-fips.sigstore.json
            dist/acp-compute-fips.sigstore.json
          if-no-files-found: error
          retention-days: 1

      - name: Emit hashes for SLSA provenance
        id: hash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # The subjects are the twenty binaries (five, their -fips variants
          # and the ten for the other platforms), the worker package, the
          # wheel, the sdist and the checksums list, by the names they are
          # uploaded under.
          mkdir -p subjects
          for b in $RELEASE_BINARIES $RELEASE_BINARIES_FIPS $RELEASE_CROSS; do cp "bin/$b" subjects/; done
          cp "dist/genome-worker-${VERSION}.tar.gz" "dist/$PY_WHEEL" "dist/$PY_SDIST" "dist/checksums-${VERSION}.txt" subjects/
          cd subjects
          # shellcheck disable=SC2086
          HASHES=$(sha256sum $RELEASE_BINARIES $RELEASE_BINARIES_FIPS $RELEASE_CROSS "genome-worker-${VERSION}.tar.gz" "$PY_WHEEL" "$PY_SDIST" "checksums-${VERSION}.txt" | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      # Uploaded one at a time, by gh, on purpose. The action that used to do
      # this uploads all 25 assets concurrently and deletes any same-named asset
      # first; against one release that races, and the step ends with a bare
      # "Error saving asset" after an arbitrary subset has landed. It cost three
      # failed release runs: v0.3.0 (no assets at all), v0.3.1 (21 of 25, fixed
      # by a rerun) and v0.3.2 (13 of 25, and a rerun of the failed job did not
      # fix it — the release had to be deleted and the whole run repeated).
      # Serial uploads are slower by seconds and have no such failure mode; the
      # retry covers a genuinely transient API error without hiding a real one.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The release page says which file is for which machine; the
          # CHANGELOG says what changed.
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          See CHANGELOG.md for $TAG.

          | Your machine | Files |
          | - | - |
          | Linux x86-64 — a server; the daemons too | \`acpctl\`, \`acp-keygen\`, \`sagvd\`, \`acp-compute\`, \`acp-bootstrap\`; \`<name>-fips\` on the certified module |
          | Linux arm64 | \`acpctl-linux-arm64\`, \`acp-keygen-linux-arm64\` |
          | macOS, Apple silicon | \`acpctl-darwin-arm64\`, \`acp-keygen-darwin-arm64\` |
          | macOS, Intel | \`acpctl-darwin-amd64\`, \`acp-keygen-darwin-amd64\` |
          | Windows x64 | \`acpctl-windows-amd64.exe\`, \`acp-keygen-windows-amd64.exe\` |
          | Windows Arm | \`acpctl-windows-arm64.exe\`, \`acp-keygen-windows-arm64.exe\` |

          Python: \`pip install vaultgenome\` (the auditor's verifier of the audit log) and \`pip install "vaultgenome[genome]"\` (the model side of a genome) — the wheel and the sdist here are the files PyPI has.

          A deployment of this release on a Google Cloud Confidential VM (AMD SEV-SNP), verified, proven and left running — [![Open in Cloud Shell](https://gstatic.com/cloudssh/images/open-btn.svg)](https://shell.cloud.google.com/cloudshell/editor?cloudshell_git_repo=https://github.com/vault-genome/vaultgenome-core&cloudshell_git_branch=$TAG&cloudshell_workspace=deploy/gcp&cloudshell_tutorial=tutorial.md) — or \`deploy/gcp/deploy.sh --tag $TAG\` wherever gcloud is signed in (\`deploy/gcp/README.md\`).

          Check what you downloaded before you run it: \`sha256sum -c checksums-$TAG.txt\` against the signed list, and \`cosign verify-blob\` on any file — README, "Download and verify a release".
          EOF
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
          cross_files=""; for b in $RELEASE_CROSS; do cross_files="$cross_files bin/$b"; done
          uploaded=0
          # shellcheck disable=SC2086
          for f in bin/sagvd bin/acp-compute bin/acpctl bin/acp-bootstrap bin/acp-keygen \
                   bin/sagvd-fips bin/acp-compute-fips bin/acpctl-fips bin/acp-bootstrap-fips bin/acp-keygen-fips \
                   $cross_files dist/genome-worker-*.tar.gz dist/vaultgenome-*.whl dist/vaultgenome-*.tar.gz dist/checksums-*.txt \
                   dist/*.sbom.spdx.json dist/*.sig dist/*.cert dist/*.sigstore.json; do
            [ -f "$f" ] || { echo "missing artifact: $f"; exit 1; }
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then
                uploaded=$((uploaded + 1)); break
              fi
              [ "$attempt" = 3 ] && { echo "failed to upload $f after 3 attempts"; exit 1; }
              echo "upload of $f failed, attempt $attempt; retrying"; sleep $((attempt * 5))
            done
          done
          echo "uploaded $uploaded assets"
          # 5 binaries, their 5 -fips variants, the 10 tools for the other
          # platforms, the worker package, the wheel and the sdist = 23
          # artifacts, each with an SBOM, and for each of those forty-six
          # files a signature, a certificate and a Sigstore bundle: 184; the
          # checksums list with its signature, certificate and bundle: 188 assets
          [ "$uploaded" -eq 188 ] || { echo "expected 188 assets, uploaded $uploaded"; exit 1; }

  # PyPI: the wheel and the sdist the build job signed, published under the
  # release workflow's own identity — PyPI's trusted publishing accepts the
  # OIDC token of this repository, this workflow file and the `pypi`
  # environment, so no token is stored anywhere — with PyPI's provenance
  # attestations beside them. A rehearsal tag (vX.Y.Z-rcN) does not reach
  # this job: PyPI cannot take a version back, and the rehearsal's wheel
  # carries the final version number.
  pypi:
    needs: [build-and-sign]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/vaultgenome/
    permissions:
      id-token: write       # trusted publishing
    steps:
      - name: The Python distribution from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distribution
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'

      # As the image job does with the binaries: each file must verify under
      # this workflow's identity on this tag before it is published.
      - name: The files are the signed ones
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p pypi
          for f in dist/vaultgenome-*.whl dist/vaultgenome-*.tar.gz; do
            cosign verify-blob --new-bundle-format --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            mv "$f" pypi/
          done
          sha256sum pypi/*

      - name: Publish to PyPI (trusted publishing, with attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi/
          attestations: true
          print-hash: true

  slsa-provenance:
    needs: [build-and-sign]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0   # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- the SLSA generator must be referenced by tag: slsa-verifier checks the builder id against the tag, and a hash-pinned reference does not verify
    with:
      base64-subjects: ${{ needs.build-and-sign.outputs.hashes }}
      upload-assets: true

  # The four container images of the release: sagvd on distroless static,
  # acp-compute on python-slim with the worker's hash-locked runtime
  # (deploy/image/*/Dockerfile), and sagvd-fips and acp-compute-fips —
  # the same Dockerfiles over the -fips binaries (ADR 0030), the binary
  # at the same path inside, so a -fips image is a drop-in. Nothing is
  # compiled here: the binaries are the ones build-and-sign produced,
  # verified against their Sigstore bundles before they are packed, so
  # the image carries the bytes the release assets carry. Each image is
  # pushed by digest, signed keyless by digest, given an SBOM attestation,
  # and named with its digest in images-<tag>.txt among the release
  # assets; slsa-images attests how each was built.
  images:
    needs: [build-and-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write       # images-<tag>.txt as a release asset
      packages: write       # ghcr.io
      id-token: write       # keyless cosign
    outputs:
      sagvd_digest: ${{ steps.sagvd.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      sagvd_fips_digest: ${{ steps.sagvd_fips.outputs.digest }}
      worker_fips_digest: ${{ steps.worker_fips.outputs.digest }}
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The signed binaries from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'

      # The artifact is this workflow's own, but the check costs nothing
      # and makes the image job stand on the signatures, not on the
      # artifact store: each binary must verify under this workflow's
      # identity on this tag before it is packed.
      - name: The binaries are the signed ones
        run: |
          set -euo pipefail
          for b in sagvd acp-compute sagvd-fips acp-compute-fips; do
            cosign verify-blob --new-bundle-format --bundle "dist/${b}.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "bin/${b}"
          done
          chmod 0755 bin/sagvd bin/acp-compute bin/sagvd-fips bin/acp-compute-fips
          sha256sum bin/sagvd bin/acp-compute bin/sagvd-fips bin/acp-compute-fips

      # The repository's .dockerignore excludes bin/, so the root cannot be a
      # build context that carries a binary: each image gets a staged
      # context of its own under dist/image-context/ — the verified binary,
      # and for the worker the package's locks and code.
      - name: Stage the image contexts
        run: |
          set -euo pipefail
          mkdir -p dist/image-context/sagvd dist/image-context/acp-compute/genome \
                   dist/image-context/sagvd-fips dist/image-context/acp-compute-fips/genome
          cp bin/sagvd dist/image-context/sagvd/sagvd
          cp bin/acp-compute dist/image-context/acp-compute/acp-compute
          # The -fips contexts carry the -fips binary under the binary's own
          # name: the Dockerfile and the path inside the image are the same.
          cp bin/sagvd-fips dist/image-context/sagvd-fips/sagvd
          cp bin/acp-compute-fips dist/image-context/acp-compute-fips/acp-compute
          for ctx in acp-compute acp-compute-fips; do
            cp workers/genome/requirements-ci.lock workers/genome/requirements-torch-cpu.lock "dist/image-context/$ctx/genome/"
            cp -R workers/genome/vg_genome "dist/image-context/$ctx/genome/vg_genome"
          done
          find dist/image-context -name '__pycache__' -prune -exec rm -rf {} +
          find dist/image-context -type f | sort | xargs sha256sum

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance and sbom off: buildx would otherwise push an attestation
      # manifest list and the digest would name that list, not the image;
      # the provenance comes from slsa-images and the SBOM from cosign attest.
      - name: Build and push sagvd
        id: sagvd
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/image-context/sagvd
          file: deploy/image/sagvd/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/sagvd:${{ github.ref_name }}

      - name: Build and push acp-compute
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/image-context/acp-compute
          file: deploy/image/acp-compute/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/acp-compute:${{ github.ref_name }}

      - name: Build and push sagvd-fips
        id: sagvd_fips
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/image-context/sagvd-fips
          file: deploy/image/sagvd/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/sagvd-fips:${{ github.ref_name }}

      - name: Build and push acp-compute-fips
        id: worker_fips
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: dist/image-context/acp-compute-fips
          file: deploy/image/acp-compute/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/acp-compute-fips:${{ github.ref_name }}

      - name: Sign the images (keyless, by digest)
        env:
          SAGVD_DIGEST: ${{ steps.sagvd.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SAGVD_FIPS_DIGEST: ${{ steps.sagvd_fips.outputs.digest }}
          WORKER_FIPS_DIGEST: ${{ steps.worker_fips.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${OWNER}/sagvd@${SAGVD_DIGEST}"
          cosign sign --yes "${REGISTRY}/${OWNER}/acp-compute@${WORKER_DIGEST}"
          cosign sign --yes "${REGISTRY}/${OWNER}/sagvd-fips@${SAGVD_FIPS_DIGEST}"
          cosign sign --yes "${REGISTRY}/${OWNER}/acp-compute-fips@${WORKER_FIPS_DIGEST}"

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: SBOM per image, attested to the image
        env:
          SAGVD_DIGEST: ${{ steps.sagvd.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SAGVD_FIPS_DIGEST: ${{ steps.sagvd_fips.outputs.digest }}
          WORKER_FIPS_DIGEST: ${{ steps.worker_fips.outputs.digest }}
        run: |
          set -euo pipefail
          SYFT="${{ steps.syft.outputs.cmd }}"
          mkdir -p dist
          for pair in "sagvd:${SAGVD_DIGEST}" "acp-compute:${WORKER_DIGEST}" "sagvd-fips:${SAGVD_FIPS_DIGEST}" "acp-compute-fips:${WORKER_FIPS_DIGEST}"; do
            name="${pair%%:*}"; digest="${pair#*:}"
            "$SYFT" "registry:${REGISTRY}/${OWNER}/${name}@${digest}" -o spdx-json="dist/${name}.image.sbom.spdx.json"
            cosign attest --yes --type spdxjson --predicate "dist/${name}.image.sbom.spdx.json" "${REGISTRY}/${OWNER}/${name}@${digest}"
          done

      # One small asset names the images by digest, so a deployment that
      # starts from the release page pulls exactly what was signed; its
      # Sigstore bundle verifies offline like the others'.
      - name: Record the digests as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
          SAGVD_DIGEST: ${{ steps.sagvd.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          SAGVD_FIPS_DIGEST: ${{ steps.sagvd_fips.outputs.digest }}
          WORKER_FIPS_DIGEST: ${{ steps.worker_fips.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "${REGISTRY}/${OWNER}/sagvd@${SAGVD_DIGEST}"
            echo "${REGISTRY}/${OWNER}/acp-compute@${WORKER_DIGEST}"
            echo "${REGISTRY}/${OWNER}/sagvd-fips@${SAGVD_FIPS_DIGEST}"
            echo "${REGISTRY}/${OWNER}/acp-compute-fips@${WORKER_FIPS_DIGEST}"
          } > "dist/images-${TAG}.txt"
          cosign sign-blob --yes --new-bundle-format "dist/images-${TAG}.txt" \
            --output-signature "dist/images-${TAG}.txt.sig" \
            --output-certificate "dist/images-${TAG}.txt.cert" \
            --bundle "dist/images-${TAG}.txt.sigstore.json"
          for f in "dist/images-${TAG}.txt" "dist/images-${TAG}.txt.sig" "dist/images-${TAG}.txt.cert" "dist/images-${TAG}.txt.sigstore.json" \
                   dist/sagvd.image.sbom.spdx.json dist/acp-compute.image.sbom.spdx.json \
                   dist/sagvd-fips.image.sbom.spdx.json dist/acp-compute-fips.image.sbom.spdx.json; do
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then break; fi
              [ "$attempt" = 3 ] && { echo "failed to upload $f after 3 attempts"; exit 1; }
              sleep $((attempt * 5))
            done
          done
          cat "dist/images-${TAG}.txt"

  slsa-images:
    needs: [images]
    permissions:
      actions: read
      id-token: write
      packages: write
    strategy:
      matrix:
        include:
          - image: sagvd
            digest: ${{ needs.images.outputs.sagvd_digest }}
          - image: acp-compute
            digest: ${{ needs.images.outputs.worker_digest }}
          - image: sagvd-fips
            digest: ${{ needs.images.outputs.sagvd_fips_digest }}
          - image: acp-compute-fips
            digest: ${{ needs.images.outputs.worker_fips_digest }}
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0   # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- the SLSA generator must be referenced by tag: slsa-verifier checks the builder id against the tag, and a hash-pinned reference does not verify
    with:
      image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      digest: ${{ matrix.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
