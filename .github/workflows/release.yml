# AI Continuity Platform — release workflow
#
# Triggered by a signed semver tag matching v*. Produces:
#   - four binaries (sagvd, acp-compute, acpctl, acp-bootstrap), built
#     reproducibly,
#   - an SBOM per artifact (syft, SPDX-JSON),
#   - cosign keyless signatures + transparency-log entries,
#   - a SLSA provenance attestation (slsa-github-generator).
#
# SLSA target: Level 2 at MVP, Level 3 by end of Phase 9
# (docs/doctrine/ci-security-policy.md §6).

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write       # publish release assets
  id-token: write       # keyless cosign + SLSA OIDC
  packages: read
  actions: read

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_BINARIES: sagvd acp-compute acpctl acp-bootstrap
    defaults:
      run:
        working-directory: .
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify tag is signed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          # Fetch the annotated tag object and the default branch explicitly,
          # so verification does not depend on how checkout left the workspace
          # (checkout can leave the tag name pointing at the bare commit, which
          # git verify-tag rejects as "a non-tag object of type commit").
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git fetch --no-tags origin "${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          # The keys that may sign a release are pinned on the protected default
          # branch — never read from the tagged tree, which whoever pushed the
          # tag controls. SSH keys: .github/allowed_signers; OpenPGP keys:
          # .github/release-signing-keys.asc.
          if git cat-file -e "origin/${DEFAULT_BRANCH}:.github/allowed_signers" 2>/dev/null; then
            git show "origin/${DEFAULT_BRANCH}:.github/allowed_signers" > "$RUNNER_TEMP/allowed_signers"
            git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          fi
          if git cat-file -e "origin/${DEFAULT_BRANCH}:.github/release-signing-keys.asc" 2>/dev/null; then
            git show "origin/${DEFAULT_BRANCH}:.github/release-signing-keys.asc" | gpg --batch --import
          fi
          git verify-tag "refs/tags/${TAG}" || { echo "release tag must be signed by a key pinned on ${DEFAULT_BRANCH}"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: go.sum

      - name: Build binaries (reproducible)
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          # SOURCE_DATE_EPOCH = the tagged commit's timestamp, so anything
          # in the build chain that consults it produces deterministic output.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make build
          make verify-reproducible

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: SBOM per artifact
        run: |
          mkdir -p dist
          for b in $RELEASE_BINARIES; do
            syft "bin/$b" -o spdx-json="dist/${b}.sbom.spdx.json"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign binaries (keyless)
        run: |
          for b in $RELEASE_BINARIES; do
            cosign sign-blob --yes "bin/$b" \
              --output-signature "dist/${b}.sig" \
              --output-certificate "dist/${b}.cert"
          done

      - name: Sign SBOMs (keyless)
        run: |
          for b in $RELEASE_BINARIES; do
            cosign sign-blob --yes "dist/${b}.sbom.spdx.json" \
              --output-signature "dist/${b}.sbom.sig" \
              --output-certificate "dist/${b}.sbom.cert"
          done

      - name: Emit hashes for SLSA provenance
        id: hash
        run: |
          cd bin
          HASHES=$(sha256sum $RELEASE_BINARIES | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            bin/sagvd
            bin/acp-compute
            bin/acpctl
            bin/acp-bootstrap
            dist/*.sbom.spdx.json
            dist/*.sig
            dist/*.cert

  slsa-provenance:
    needs: [build-and-sign]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0   # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag -- the SLSA generator must be referenced by tag: slsa-verifier checks the builder id against the tag, and a hash-pinned reference does not verify
    with:
      base64-subjects: ${{ needs.build-and-sign.outputs.hashes }}
      upload-assets: true
