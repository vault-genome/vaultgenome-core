#
# The Python distribution `vaultgenome` — what `pip install vaultgenome`
# brings. Two things live in it, each from where it lives in this tree:
#
#   vaultgenome.auditor   the auditor's own verifier of the audit log
#                         (tools/auditor; the standard library only, no
#                         dependencies), as the command `vaultgenome-audit`;
#   vg_genome             the model side of a genome (workers/genome), as the
#                         command `vg-genome` and `python -m vg_genome`; its
#                         runtime is the extra `[genome]`, pinned to the
#                         versions the worker's records were made on
#                         (workers/genome/requirements.txt).
#
# The release builds the wheel and the sdist twice from the tag with the
# build tools of python/requirements-build.lock and compares them, signs
# them beside the binaries and publishes them to PyPI from the release
# workflow's own identity (trusted publishing; no stored token). The version
# here must equal the tag's; the release job refuses otherwise.
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultgenome"
version = "0.13.0"
description = "Vault Genome: the auditor's verifier of the audit log, and the model side of a genome"
readme = "python/README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Serhii Nikolaichuk" }, { name = "Rodion Sorokin" }]
keywords = ["confidential-computing", "attestation", "sev-snp", "tdx", "nitro-enclaves", "audit-log", "lora", "model-continuity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# The worker's pinned runtime, the same lines as workers/genome/requirements.txt.
genome = [
  "torch==2.14.1",
  "transformers==5.19.0",
  "tokenizers==0.23.3",
  "safetensors==0.8.0",
  "numpy==2.5.4",
]

[project.urls]
Homepage = "https://github.com/vault-genome/vaultgenome-core"
Source = "https://github.com/vault-genome/vaultgenome-core"
Changelog = "https://github.com/vault-genome/vaultgenome-core/blob/main/CHANGELOG.md"
"Verifiable claims" = "https://github.com/vault-genome/vaultgenome-core/blob/main/VERIFIABLE-CLAIMS.md"
Releases = "https://github.com/vault-genome/vaultgenome-core/releases"
Issues = "https://github.com/vault-genome/vaultgenome-core/issues"

[project.scripts]
vaultgenome-audit = "vaultgenome.auditor.verify_audit:main"
vg-genome = "vg_genome.__main__:main"

[tool.setuptools]
packages = ["vaultgenome", "vaultgenome.auditor", "vg_genome"]
include-package-data = false

[tool.setuptools.package-dir]
vaultgenome = "python/vaultgenome"
"vaultgenome.auditor" = "tools/auditor"
vg_genome = "workers/genome/vg_genome"
