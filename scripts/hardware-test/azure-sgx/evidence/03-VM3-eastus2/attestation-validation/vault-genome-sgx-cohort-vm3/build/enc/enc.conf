# Vault Genome SGX quote-binding enclave — signing config.
# These are the standard development values used by Open Enclave samples.
# The MRENCLAVE produced by oesign with this config is what the verifier
# pins as "this is the Vault Genome quote-binding enclave."

Debug=1
NumHeapPages=1024
NumStackPages=1024
NumTCS=1
ProductID=1
SecurityVersion=1
