# Vault Genome SGX quote-binding enclave — signing config.
# A release enclave: Debug=0, so the quote's attributes carry no DEBUG bit
# and Microsoft Azure Attestation reports x-ms-sgx-is-debuggable false;
# the host creates it without OE_ENCLAVE_FLAG_DEBUG. (Until 2026-10-15 the
# kit built a debug enclave, the Open Enclave samples' default.) The
# MRENCLAVE produced by oesign with this config is what the verifier pins
# as "this is the Vault Genome quote-binding enclave."

Debug=0
NumHeapPages=1024
NumStackPages=1024
NumTCS=1
ProductID=1
SecurityVersion=1
