title = "VaultGenome secret-scan configuration"

# Keep the full built-in gitleaks ruleset active (AWS keys, private keys,
# generic high-entropy tokens, cloud credentials, ...). We only add an
# allowlist below; we do not weaken any detection rule.
[extend]
useDefault = true

[allowlist]
description = """
Hardware-attestation EVIDENCE, not secrets.

scripts/hardware-test/*/evidence/ holds captured attestation results from real
confidential-VM runs: Azure Attestation (MAA) JWTs, SEV-SNP reports, and the
public AMD/Azure certificate chains that verify them. An MAA token is a signed,
short-lived, already-expired assertion ABOUT an enclave (its measurements —
sgx-mrenclave / sgx-mrsigner / report-data), issued by the attestation service.
It grants no access and contains no key material; it is the proof the test
produced, published on purpose. gitleaks' generic high-entropy rules (notably
`jwt`) match these by shape, so they are allowlisted for the evidence paths
ONLY. The product source, configuration, and all other tooling stay fully
scanned for real credentials.
"""
paths = [
  '''scripts/hardware-test/.*/evidence/.*''',
  # internal/genome/escrow/testdata/escrow-v1-documents.json: escrow
  # documents written by 0.7.0's v1 suites, kept so the read-only path of
  # ADR 0030 §3f is tested against real v1 bytes (the v1 suites write
  # nothing since 0.8, so `go test` cannot make them), with the throwaway
  # recovery keys that open them, generated for the fixture at b0ee2a5 and
  # never used for anything else. gitleaks' private-key rule matches the
  # PEM blocks by shape; they protect nothing outside this file.
  '''internal/genome/escrow/testdata/escrow-v1-documents\.json''',
  # internal/shared/cms/testdata/recipient-key.pem: the throwaway RSA-3072
  # key OpenSSL 3 wrapped the CMS vectors to (ADR 0036, part three), made
  # for those vectors by make-vectors.sh beside it and used for nothing
  # else, so the CMS reader is held to an implementation nobody here
  # wrote. gitleaks' private-key rule matches the PEM block by shape; it
  # protects nothing.
  '''internal/shared/cms/testdata/recipient-key\.pem''',
]
regexes = [
  # `type PrivateKey = ed25519.PrivateKey` in internal/shared/crypto: a Go
  # stdlib type alias, not a secret. gitleaks' generic-api-key rule matches
  # it by shape (`...Key = <mixed-case token>`). The literal string
  # "ed25519.PrivateKey" is only ever a type reference, never a credential.
  '''ed25519\.PrivateKey''',
  # PGP key fingerprints of apt repository signing keys, as the vendors
  # publish them; the Azure SGX kit's bootstrap checks a downloaded key
  # against them before it enters the keyring
  # (scripts/hardware-test/azure-sgx/scripts/01-bootstrap-vm.sh). A fingerprint
  # identifies a public key and grants nothing; the generic-api-key rule matches
  # the assignment by shape (`..._KEY_FPR="<40 hex>"`). Intel's is in the tree;
  # Microsoft's left it on 2026-10-15, when the kit stopped installing the
  # Azure DCAP client, and stays listed because the gate scans the history.
  '''150434D1488BF80308B69398E5C7F0FA1C6C6C3C''',
  '''BC528686B50D79E339D3721CEB3E94ADBE1229CF''',
]
