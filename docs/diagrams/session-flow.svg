<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vault Genome — per-session flow diagram.
  Shows the lifecycle from job submission through release decision.
  Replaces the ASCII flow in reference design 02 (healthcare AI).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9aa0a6"/>
    </marker>
    <marker id="arrowOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f8f5b"/>
    </marker>
    <marker id="arrowFail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c14f4f"/>
    </marker>
  </defs>
  <rect width="1100" height="720" fill="#0a0e14"/>

  <!-- Lanes -->
  <text x="80" y="35" fill="#7ad3ff" font-size="11" letter-spacing="2">OPERATOR</text>
  <text x="320" y="35" fill="#7ad3ff" font-size="11" letter-spacing="2">VAULT (sagvd)</text>
  <text x="720" y="35" fill="#7ad3ff" font-size="11" letter-spacing="2">WORKER (acp-compute)</text>
  <text x="1000" y="35" fill="#7ad3ff" font-size="11" letter-spacing="2">AUDIT</text>

  <!-- Lane separators -->
  <line x1="280" y1="50" x2="280" y2="700" stroke="#2c3038" stroke-dasharray="4,4"/>
  <line x1="680" y1="50" x2="680" y2="700" stroke="#2c3038" stroke-dasharray="4,4"/>
  <line x1="970" y1="50" x2="970" y2="700" stroke="#2c3038" stroke-dasharray="4,4"/>

  <!-- Step 1: submit -->
  <rect x="40" y="70" width="220" height="38" rx="5" fill="#181c24" stroke="#2c3038"/>
  <text x="150" y="93" text-anchor="middle" fill="#e8eaed" font-size="12.5">1. POST /v1/jobs</text>
  <line x1="260" y1="89" x2="320" y2="89" stroke="#9aa0a6" marker-end="url(#arrow2)"/>

  <!-- Step 2: vault auth + queue -->
  <rect x="320" y="70" width="340" height="38" rx="5" fill="#23283a" stroke="#3a4054"/>
  <text x="490" y="93" text-anchor="middle" fill="#e8eaed" font-size="12.5">2. authenticate · validate · enqueue</text>
  <line x1="490" y1="108" x2="490" y2="135" stroke="#9aa0a6" marker-end="url(#arrow2)"/>

  <!-- Step 3: audit REQUEST_RECEIVED -->
  <rect x="980" y="70" width="100" height="38" rx="5" fill="#181c24" stroke="#2c3038"/>
  <text x="1030" y="93" text-anchor="middle" fill="#9ee0b8" font-size="11">REQUEST_RECEIVED</text>
  <line x1="660" y1="89" x2="980" y2="89" stroke="#9aa0a6" marker-end="url(#arrow2)" stroke-dasharray="2,2"/>

  <!-- Step 4: handshake start -->
  <rect x="320" y="135" width="340" height="38" rx="5" fill="#23283a" stroke="#3a4054"/>
  <text x="490" y="158" text-anchor="middle" fill="#e8eaed" font-size="12.5">3. accept worker · 4-frame return path</text>
  <line x1="660" y1="154" x2="720" y2="154" stroke="#9aa0a6" marker-end="url(#arrow2)"/>

  <!-- Step 5: worker quotes -->
  <rect x="720" y="135" width="240" height="38" rx="5" fill="#0b3d2e" stroke="#1f8f5b"/>
  <text x="840" y="158" text-anchor="middle" fill="#7ddba6" font-size="12.5">4. Producer.Quote(nonce)</text>
  <line x1="720" y1="195" x2="660" y2="195" stroke="#9aa0a6" marker-end="url(#arrow2)"/>

  <!-- Step 6: vault verifies -->
  <rect x="320" y="180" width="340" height="38" rx="5" fill="#23283a" stroke="#3a4054"/>
  <text x="490" y="203" text-anchor="middle" fill="#e8eaed" font-size="12.5">5. Verifier.Verify(evidence, nonce)</text>
  <line x1="490" y1="218" x2="490" y2="245" stroke="#9aa0a6" marker-end="url(#arrow2)"/>

  <!-- Step 7: audit TRUST_EVALUATED -->
  <rect x="980" y="180" width="100" height="38" rx="5" fill="#181c24" stroke="#2c3038"/>
  <text x="1030" y="203" text-anchor="middle" fill="#9ee0b8" font-size="11">TRUST_EVALUATED</text>
  <line x1="660" y1="199" x2="980" y2="199" stroke="#9aa0a6" marker-end="url(#arrow2)" stroke-dasharray="2,2"/>

  <!-- Step 8: vault issues session + sealed material -->
  <rect x="320" y="245" width="340" height="38" rx="5" fill="#23283a" stroke="#3a4054"/>
  <text x="490" y="268" text-anchor="middle" fill="#e8eaed" font-size="12.5">6. Sealer.Seal(material, aad) → SealedMaterialRef</text>
  <line x1="660" y1="264" x2="720" y2="264" stroke="#9aa0a6" marker-end="url(#arrow2)"/>

  <!-- Step 9: audit SESSION_ISSUED -->
  <rect x="980" y="245" width="100" height="38" rx="5" fill="#181c24" stroke="#2c3038"/>
  <text x="1030" y="268" text-anchor="middle" fill="#9ee0b8" font-size="11">SESSION_ISSUED</text>
  <line x1="660" y1="264" x2="980" y2="264" stroke="#9aa0a6" marker-end="url(#arrow2)" stroke-dasharray="2,2"/>

  <!-- Step 10: worker computes inside enclave -->
  <rect x="720" y="245" width="240" height="80" rx="5" fill="#0b3d2e" stroke="#1f8f5b"/>
  <text x="840" y="270" text-anchor="middle" fill="#7ddba6" font-size="12.5">7. Sealer.Unseal(SealedRef, aad)</text>
  <text x="840" y="290" text-anchor="middle" fill="#7ddba6" font-size="12.5">8. inference inside TEE</text>
  <text x="840" y="310" text-anchor="middle" fill="#7ddba6" font-size="12.5">9. emit CandidateOutput (signed)</text>
  <line x1="720" y1="335" x2="660" y2="335" stroke="#9aa0a6" marker-end="url(#arrow2)"/>

  <!-- Step 11: validation pipeline -->
  <rect x="320" y="335" width="340" height="80" rx="5" fill="#23283a" stroke="#3a4054"/>
  <text x="490" y="358" text-anchor="middle" fill="#e8eaed" font-size="12.5">10. validation pipeline</text>
  <text x="490" y="378" text-anchor="middle" fill="#9aa0a6" font-size="11">operational · semantic · behavioural</text>
  <text x="490" y="396" text-anchor="middle" fill="#9aa0a6" font-size="11">verdict.dimension × verdict.score</text>

  <!-- Decision -->
  <line x1="490" y1="415" x2="490" y2="450" stroke="#9aa0a6" marker-end="url(#arrow2)"/>
  <polygon points="490,450 540,485 490,520 440,485" fill="#23283a" stroke="#3a4054"/>
  <text x="490" y="490" text-anchor="middle" fill="#e8eaed" font-size="12.5">verdict?</text>

  <!-- Pass branch -->
  <line x1="540" y1="485" x2="700" y2="485" stroke="#1f8f5b" stroke-width="1.7" marker-end="url(#arrowOk)"/>
  <text x="620" y="478" text-anchor="middle" fill="#7ddba6" font-size="11">PASS</text>
  <rect x="700" y="465" width="240" height="40" rx="5" fill="#0b3d2e" stroke="#1f8f5b"/>
  <text x="820" y="490" text-anchor="middle" fill="#7ddba6" font-size="12">11. release decision · disclosure</text>

  <!-- Fail branch -->
  <line x1="440" y1="485" x2="280" y2="485" stroke="#c14f4f" stroke-width="1.7" marker-end="url(#arrowFail)"/>
  <text x="360" y="478" text-anchor="middle" fill="#e89191" font-size="11">FAIL</text>
  <rect x="40" y="465" width="240" height="40" rx="5" fill="#3d1717" stroke="#c14f4f"/>
  <text x="160" y="490" text-anchor="middle" fill="#e89191" font-size="12">11′. incident · session invalidated</text>

  <!-- Audit RELEASE_DECIDED -->
  <line x1="940" y1="485" x2="980" y2="485" stroke="#9aa0a6" marker-end="url(#arrow2)" stroke-dasharray="2,2"/>
  <rect x="980" y="465" width="100" height="40" rx="5" fill="#181c24" stroke="#2c3038"/>
  <text x="1030" y="490" text-anchor="middle" fill="#9ee0b8" font-size="11">RELEASE_DECIDED</text>

  <!-- Final return path -->
  <line x1="820" y1="505" x2="820" y2="555" stroke="#9aa0a6" marker-end="url(#arrow2)"/>
  <rect x="700" y="555" width="240" height="40" rx="5" fill="#0b3d2e" stroke="#1f8f5b"/>
  <text x="820" y="580" text-anchor="middle" fill="#7ddba6" font-size="12">12. CandidateOutput → caller</text>
  <line x1="700" y1="575" x2="280" y2="575" stroke="#9aa0a6" marker-end="url(#arrow2)"/>
  <rect x="40" y="555" width="240" height="40" rx="5" fill="#181c24" stroke="#2c3038"/>
  <text x="160" y="580" text-anchor="middle" fill="#e8eaed" font-size="12">13. response delivered</text>

  <!-- Footer -->
  <text x="550" y="650" text-anchor="middle" fill="#5f6368" font-size="10.5">All audit lines (dotted) append to the bbolt chain (hash-linked, signed by audit kid)</text>
  <text x="550" y="668" text-anchor="middle" fill="#5f6368" font-size="10.5">acpctl audit verify replays the chain offline · acpctl lineage traces a session</text>
  <text x="550" y="686" text-anchor="middle" fill="#5f6368" font-size="10.5">Latency budget per stage documented in docs/reference-designs/01-tier1-bank-fix-engine.md</text>
</svg>
